    "transformers>=5.14.0",
    "trl>=1.9.0",
    "peft>=0.20.0",
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "rouge-score>=0.1.2",
    "sentence-transformers>=3.0.0",
    "chromadb>=1.5.5",
]
